[package]
name = "atomprobe"
version = "0.1.0"
description = "AtomProbe — mp4 atom structure analyzer"
authors = []
edition = "2021"

[lib]
name = "atomprobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Transitive dep of tauri (via wry/tao) — time 0.3.37+ changed Format::parse's
# signature, breaking cookie 0.18.1's call site. Pin below the break until
# cookie releases a fix.
time = "=0.3.36"
