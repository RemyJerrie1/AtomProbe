name: CI
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run metrics:size
