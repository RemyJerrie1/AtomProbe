name: CI
on:
  push:
    branches: [dev, uat, prod]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run metrics:size

  # Release only on prod, then backmerge prod -> uat -> dev so lower branches don't drift.
  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases, push CHANGELOG + backmerge
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          # admin PAT so release + backmerge can push past branch protection; falls back to default token
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: backmerge prod -> uat -> dev
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git fetch origin
          for b in uat dev; do
            git checkout "$b"
            git merge origin/prod --no-edit
            git push origin "$b"
          done
          # ponytail: conflict -> step fails, resolve by hand; no bot-PR until it actually hurts
