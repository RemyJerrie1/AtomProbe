name: CI
on:
  push:
    branches: [dev, uat, prod]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run metrics:size

  # release-please: maintains a release PR on dev; merging it cuts the tag + GitHub Release + CHANGELOG.
  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node

  # backmerge: after a promotion lands on uat/prod, OPEN (not merge) fan-out PRs so lower branches don't drift.
  backmerge:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: open backmerge PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ github.ref_name }}
        run: |
          if [ "$SRC" = "prod" ]; then targets="uat dev"; else targets="dev"; fi
          for dst in $targets; do
            gh pr create --base "$dst" --head "$SRC" \
              --title "backmerge: $SRC -> $dst" \
              --body "Auto-opened backmerge. Review and merge to avoid drift." \
              || echo "backmerge $SRC -> $dst: PR exists or nothing to merge"
          done
